<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>VennCV（egui WASM · 遗留）</title>
  <style>
    html, body {
      overflow: hidden;
      margin: 0;
      width: 100%;
      height: 100%;
      background: #2b2b2b;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="venncv_canvas"></canvas>
  <link data-trunk rel="rust" href="../../Cargo.toml"
        data-target="wasm32-unknown-unknown"
        data-cargo-no-default-features
        data-wasm-opt="0"/>
  <script>
    window.addEventListener("TrunkApplicationStarted", () => {
      const { WebHandle } = window.wasmBindings;
      const handle = new WebHandle();
      handle.start("venncv_canvas").catch(function (e) { console.error(e); });
    });
  </script>
</body>
</html>
