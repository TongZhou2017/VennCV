[package]
name = "venncv-tauri"
version = "0.11.15"
description = "VennCV desktop (Tauri + WebView)"
authors = ["VennCV"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "venncv_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls", "charset"] }
serde_json = "1"
tauri = { version = "2", features = [] }
